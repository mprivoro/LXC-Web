# LXC-Web runtime config (INI). Read by lwp.py at startup from the cwd.
# [global] bind address/port; [database] SQLite users file; [session] idle
# minutes + secret; [logging] container command log and MCP request log; [lxc] LXC conf file,
# fallback store, cached images; [overview] df partition and refresh seconds;
# [mcp] Streamable HTTP MCP next to the panel. url is the listen address.
# key is a read-only default token. User write tokens are hashed in SQLite.

[global]
address = 0.0.0.0
port = 5000
debug = False

[database]
file = lwp.db

[session]
time = 10
secret_key = a104b8dd3d99f5005fdaef3aced281ff9d9c639d225182bd3203724053d7add5

[logging]
file = lwp-containers.log
mcp = lwp-mcp.log

[lxc]
conf = /etc/lxc/lxc.conf
store = /var/lib/lxc
images = /images/lxc-data/templates

[overview]
partition = /images
refresh = 60

[mcp]
enabled = true
url = http://0.0.0.0:5005/mcp
key = 34caFM3Jc2FrHigYVP9Q24yEOFqIVH3_hLi0FxU9JaA
